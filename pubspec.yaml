name: lyrics
description: "Bars: write rap lyrics, find rhymes, and sync lines to a beat."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.35.0
  path_provider: ^2.1.6
  path: ^1.9.1
  go_router: ^18.0.1
  drift_flutter: ^0.3.1
  flutter_langdetect: ^0.0.2
  http: ^1.6.0
  file_picker: ^13.1.0
  just_audio: ^0.10.6
  just_waveform: ^0.0.7
  archive: ^4.3.0
  scrollable_positioned_list: ^0.3.8
  wakelock_plus: ^1.8.0
  url_launcher: ^6.3.2
  flutter_lucide: ^1.47.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0
  path_provider_platform_interface: ^2.1.3
  wakelock_plus_platform_interface: ^1.7.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  adaptive_icon_background: "#673AB7"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
